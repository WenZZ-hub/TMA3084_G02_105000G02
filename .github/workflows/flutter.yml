
name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/menu
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: brew_and_co
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: brew_and_co
        run: flutter analyze

      - name: Run tests
        working-directory: brew_and_co
        run: flutter test
